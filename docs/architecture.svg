<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 910" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
    <marker id="arrowInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/>
    </marker>
  </defs>

  <style>
    .mono { font-family: 'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace; }
    .title { font-size: 16px; font-weight: 600; fill: #0b0b0b; letter-spacing: 0.08em; }
    .caption { font-size: 11px; fill: #52514e; }
    .boxTitle { font-size: 11px; font-weight: 600; fill: #0b0b0b; letter-spacing: 0.1em; }
    .boxSub { font-size: 10px; fill: #52514e; }
    .body { font-size: 11px; fill: #0b0b0b; }
    .body2 { font-size: 11px; fill: #52514e; }
    .small { font-size: 10px; fill: #52514e; }
    .node { fill: #fcfcfb; stroke: #b9b8b2; stroke-width: 1.2; }
    .box { fill: #fcfcfb; stroke: #cfcec8; stroke-width: 1; }
    .flow { stroke: #52514e; stroke-width: 1.4; fill: none; }
    .nodeTitle { font-size: 12px; font-weight: 600; fill: #0b0b0b; }
    .nodeSub { font-size: 10px; fill: #52514e; }
  </style>

  <!-- background: painted explicitly so the file reads on any page theme -->
  <rect x="0" y="0" width="1240" height="910" fill="#f9f9f7"/>

  <!-- masthead: canary chip + title -->
  <rect x="40" y="18" width="32" height="32" rx="7" fill="#e8b400"/>
  <g transform="translate(44,22) scale(0.75)">
    <path d="M1.5 11.5 10 15.5l-5.5 4z" fill="#0b0b0b"/>
    <circle cx="14" cy="18" r="9" fill="#0b0b0b"/>
    <circle cx="21" cy="10" r="6" fill="#0b0b0b"/>
    <path d="M26.5 7.5 32 10.2l-5.5 2.7z" fill="#0b0b0b"/>
    <circle cx="23" cy="8.6" r="1.4" fill="#e8b400"/>
    <path d="M12.5 27.2v2.8M16.5 27.2v2.8" stroke="#0b0b0b" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <text x="86" y="36" class="mono title">PROMPTCANARY — HOW A CHANGE GETS SHIPPED (OR NOT)</text>
  <text x="86" y="54" class="caption">The forced eval path, the human gate, and the seam that plugs into any LLM application.</text>

  <!-- ① the change -->
  <rect x="40" y="80" width="310" height="100" rx="10" class="box"/>
  <text x="56" y="102" class="mono boxTitle">① THE CHANGE — DASHBOARD (NEXT.JS)</text>
  <text x="56" y="122" class="body">candidate system prompt — the textbox</text>
  <text x="56" y="138" class="body">model swap — dev sidebar “Baseline model (A/B)”</text>
  <text x="56" y="154" class="body">temperature</text>
  <text x="56" y="171" class="body2" font-style="italic">in production: a PR, prompt registry, or CI hook</text>

  <!-- ③ human decision -->
  <rect x="870" y="80" width="330" height="100" rx="10" class="box"/>
  <text x="886" y="102" class="mono boxTitle">③ HUMAN DECISION — POST /api/decide</text>
  <text x="886" y="122" class="body">Ship · Ship with override · Revert · Re-run</text>
  <text x="886" y="138" class="body">guard: plain Ship refused while verdict = fail</text>
  <text x="886" y="154" class="body">overrides go through — but are logged forever</text>
  <text x="886" y="171" class="body2" font-style="italic">nothing ships without a person</text>

  <!-- change → graph -->
  <path d="M150,180 L150,264" class="flow" marker-end="url(#arrow)"/>
  <text x="160" y="222" class="mono small">POST /api/run</text>

  <!-- gate ⇄ human -->
  <path d="M1000,268 L1000,186" class="flow" marker-end="url(#arrow)"/>
  <text x="948" y="215" class="mono small">report</text>
  <path d="M1040,186 L1040,264" class="flow" marker-end="url(#arrow)"/>
  <text x="1050" y="215" class="mono small">decision</text>

  <!-- ② the forced graph -->
  <rect x="40" y="210" width="1160" height="150" rx="12" fill="none" stroke="#8a897f" stroke-width="1.3"/>
  <text x="60" y="234" class="mono boxTitle">② CANARY AGENT — FORCED LANGGRAPH PATH · src/lib/agent/graph.ts (evals cannot be skipped)</text>

  <rect x="60" y="270" width="160" height="60" rx="9" class="node"/>
  <text x="140" y="294" text-anchor="middle" class="mono nodeTitle">load_change</text>
  <text x="140" y="312" text-anchor="middle" class="nodeSub">reads the live prompt</text>

  <rect x="270" y="270" width="160" height="60" rx="9" class="node"/>
  <text x="350" y="294" text-anchor="middle" class="mono nodeTitle">run_traces</text>
  <text x="350" y="312" text-anchor="middle" class="nodeSub">6 goldens × 2 variants</text>

  <rect x="480" y="270" width="160" height="60" rx="9" class="node"/>
  <text x="560" y="294" text-anchor="middle" class="mono nodeTitle">run_evals</text>
  <text x="560" y="312" text-anchor="middle" class="nodeSub">judge scores each pair</text>

  <rect x="690" y="270" width="160" height="60" rx="9" class="node"/>
  <text x="770" y="294" text-anchor="middle" class="mono nodeTitle">analyze</text>
  <text x="770" y="312" text-anchor="middle" class="nodeSub">analyst + trace tools</text>

  <rect x="900" y="270" width="170" height="60" rx="9" fill="#e8b400" stroke="#0b0b0b" stroke-width="1.2"/>
  <text x="985" y="294" text-anchor="middle" class="mono nodeTitle">gate ⏸ interrupt</text>
  <text x="985" y="312" text-anchor="middle" font-size="10" fill="#0b0b0b">waits for a human</text>

  <path d="M220,300 L264,300" class="flow" marker-end="url(#arrow)"/>
  <path d="M430,300 L474,300" class="flow" marker-end="url(#arrow)"/>
  <path d="M640,300 L684,300" class="flow" marker-end="url(#arrow)"/>
  <path d="M850,300 L894,300" class="flow" marker-end="url(#arrow)"/>

  <!-- re-run back edge -->
  <path d="M915,270 L915,252 L350,252 L350,264" class="flow" stroke-dasharray="none" marker-end="url(#arrow)"/>
  <text x="618" y="247" class="mono small">re-run</text>

  <!-- graph → app under test / judge -->
  <path d="M350,330 L350,372 L170,372 L170,434" class="flow" marker-end="url(#arrow)"/>
  <text x="190" y="366" class="mono small">6 cases × 2 answers</text>
  <path d="M560,330 L560,380 L635,380 L635,434" class="flow" marker-end="url(#arrow)"/>
  <text x="648" y="392" class="mono small">scores every pair</text>

  <!-- gate → outcomes -->
  <path d="M985,330 L985,394" class="flow" marker-end="url(#arrow)"/>
  <text x="995" y="380" class="mono small">routeGate</text>

  <!-- graph → LangSmith -->
  <path d="M1160,360 L1160,564" class="flow" marker-end="url(#arrow)"/>
  <text transform="rotate(-90 1176 468)" x="1176" y="468" text-anchor="middle" class="mono small">every node traced</text>

  <!-- ④ pluggable seam -->
  <rect x="40" y="400" width="720" height="330" rx="12" fill="none" stroke="#b28a00" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="60" y="424" class="mono boxTitle" fill="#6b5500">④ PLUGGABLE SEAM — THE ONLY APP-SPECIFIC PARTS</text>

  <rect x="60" y="440" width="220" height="180" rx="9" class="box"/>
  <text x="72" y="464" class="mono boxTitle">APP UNDER TEST</text>
  <text x="72" y="480" class="mono boxSub">runToyApp() · toy-app/run.ts</text>
  <text x="72" y="504" class="body">prompt + question → answer</text>
  <text x="72" y="521" class="body2">today: Lumina Notes FAQ bot</text>
  <text x="72" y="537" class="body2">grounded in a policy doc</text>
  <text x="72" y="560" class="body">baseline: live prompt</text>
  <text x="72" y="576" class="body2">  @ baseline model</text>
  <text x="72" y="594" class="body">candidate: new prompt</text>
  <text x="72" y="610" class="body2">  @ selected model</text>

  <rect x="300" y="440" width="210" height="180" rx="9" class="box"/>
  <text x="312" y="464" class="mono boxTitle">GOLDEN SET</text>
  <text x="312" y="480" class="mono boxSub">golden.ts · 6 cases</text>
  <text x="312" y="504" class="body">question + reference + mustCite</text>
  <text x="312" y="521" class="body2">derived from the policy doc:</text>
  <text x="312" y="537" class="body2">one case per section, plus a</text>
  <text x="312" y="553" class="body2">refusal / out-of-scope trap</text>
  <text x="312" y="577" class="body">small on purpose — runs on</text>
  <text x="312" y="593" class="body">every change; grows from the</text>
  <text x="312" y="609" class="body">failing-case memory ⑦</text>

  <rect x="530" y="440" width="210" height="180" rx="9" class="box"/>
  <text x="542" y="464" class="mono boxTitle">METRICS / JUDGE</text>
  <text x="542" y="480" class="mono boxSub">judge.ts · temp 0 · JSON out</text>
  <text x="542" y="504" class="body">faithfulness + correctness</text>
  <text x="542" y="521" class="body2">per case, with reasoning</text>
  <text x="542" y="545" class="body">regression: Δ ≤ −0.15</text>
  <text x="542" y="561" class="body">or any score &lt; 0.6</text>
  <text x="542" y="585" class="body2">swap for exact match, schema</text>
  <text x="542" y="601" class="body2">checks, or run-the-SQL tests</text>

  <text x="60" y="666" class="body">Reuse: swap these three to canary any LLM app — RAG · summarizer · extraction · SQL / codegen · agent tasks.</text>
  <text x="60" y="688" class="body2">The graph, gate, guard, memory and tracing never change.</text>

  <!-- ⑤ outcomes -->
  <rect x="800" y="400" width="330" height="140" rx="10" class="box"/>
  <text x="816" y="424" class="mono boxTitle">⑤ OUTCOMES — GUARDED TOOLS</text>
  <text x="816" y="448" class="body">ship → mark_shipped(): candidate → live</text>
  <text x="816" y="466" class="body">revert → revert_prompt(): baseline restored</text>
  <text x="816" y="484" class="body">re-run → loops the graph, same thread</text>
  <text x="816" y="508" class="body2" font-style="italic">fail-closed: no scores ⇒ shipping impossible</text>

  <!-- outcomes → LangSmith -->
  <path d="M965,540 L965,564" class="flow" marker-end="url(#arrow)"/>

  <!-- ⑥ observability -->
  <rect x="800" y="570" width="400" height="150" rx="10" class="box"/>
  <text x="816" y="594" class="mono boxTitle">⑥ OBSERVABILITY — LANGSMITH (EU)</text>
  <text x="816" y="618" class="body">traces: canary-run (5 nodes, ~24 LLM calls)</text>
  <text x="816" y="634" class="body">        + canary-decision (the gate resume)</text>
  <text x="816" y="656" class="body">feedback: verdict · faithfulness · correctness</text>
  <text x="816" y="672" class="body">        · human_decision — filterable per run</text>
  <text x="816" y="694" class="body2">Monitoring: score trend per model (modelAB metadata)</text>

  <!-- ⑦ memory -->
  <rect x="40" y="765" width="720" height="110" rx="10" class="box"/>
  <text x="56" y="789" class="mono boxTitle">⑦ LONG-TERM MEMORY — ./data (SURVIVES RESTARTS)</text>
  <text x="56" y="813" class="body">current-prompt.txt — the live prompt; rewritten by ship / revert</text>
  <text x="56" y="831" class="body">failing-cases.json — every regression remembered → promoted into future golden cases ④</text>
  <text x="56" y="849" class="body">decisions.json — audit trail: shipped / shipped_override / reverted</text>

  <!-- seam → memory (what ship/revert write) -->
  <path d="M400,730 L400,759" class="flow" marker-end="url(#arrow)"/>
  <text x="410" y="752" class="mono small">regressions + decisions persisted</text>

  <!-- legend -->
  <text x="800" y="752" class="small">solid line = runtime flow · dashed = the boundary you re-implement per application</text>
  <text x="800" y="875" class="mono small">docs/architecture.svg · PromptCanary</text>
</svg>
